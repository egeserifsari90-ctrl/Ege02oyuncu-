name: Egemodder 1234 - APK build and source setup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/egemodder-test-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v5

      - name: Extract Google Drive project archive into egemodder-test
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE='Egemodder-1234-GitHub-APK-Derleme (1).zip'
          test -f "$ARCHIVE"
          mkdir -p egemodder-test
          unzip -o -q "$ARCHIVE" 'build.gradle' 'settings.gradle' 'README.txt' 'app/*' -d egemodder-test
          test -f egemodder-test/app/src/main/AndroidManifest.xml
          test -f egemodder-test/app/src/main/java/com/egemodder/demo/MainActivity.java
          test -f egemodder-test/app/src/main/assets/index.html

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "Android sdkmanager not found" >&2; exit 1
          fi
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android test APK
        working-directory: egemodder-test
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Egemodder-1234-Test-APK
          path: egemodder-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
