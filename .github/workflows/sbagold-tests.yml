name: SBAGOLD Patch Tests
on:
  push:
    paths: ['sbagold/**', '.github/workflows/sbagold-tests.yml']
  pull_request:
    paths: ['sbagold/**', '.github/workflows/sbagold-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S sbagold -B sbagold/build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build sbagold/build --parallel 2
      - name: Run unit tests
        run: ctest --test-dir sbagold/build --output-on-failure
