name: Egemodder Native ARMv7 Compiler (not game APK)
on:
  push:
    branches: [main]
    paths:
      - 'egemodder-native/**'
      - '.github/workflows/egemodder-native-armv7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NDK from runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "Android SDK command line tools not found" >&2
            exit 1
          fi
          "$SDKMANAGER" --install 'ndk;27.2.12479018'
      - name: Compile native library for Super Bear Adventure ARMv7
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          test -f "$TOOLCHAIN"
          cmake -S egemodder-native -B egemodder-native/build \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build egemodder-native/build --parallel 2
          test -s egemodder-native/build/libegemodder.so
      - name: Upload native proof of concept only
        uses: actions/upload-artifact@v4
        with:
          name: Egemodder-Native-ARMv7-PROTOTYPE-NOT-APK
          path: egemodder-native/build/libegemodder.so
          if-no-files-found: error
