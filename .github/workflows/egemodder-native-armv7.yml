name: Egemodder Native ARMv7 Compiler (not game APK)
on:
  push:
    branches: [main, egemodder-native-patch-20261018]
    paths:
      - 'egemodder-native/**'
      - '.github/workflows/egemodder-native-armv7.yml'
  pull_request:
    branches: [main]
    paths:
      - 'egemodder-native/**'
      - '.github/workflows/egemodder-native-armv7.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host test of IL2CPP bridge (mock runtime)
        shell: bash
        run: |
          set -euo pipefail
          cmake -S egemodder-native -B egemodder-native/build-host \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build egemodder-native/build-host --parallel 2
          ctest --test-dir egemodder-native/build-host --output-on-failure
      - name: Install Android NDK from runner Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [[ -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          else
            echo "Android SDK command line tools not found" >&2
            exit 1
          fi
          "$SDKMANAGER" --install 'ndk;27.2.12479018'
      - name: Compile Android ARMv7 native library
        shell: bash
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          test -f "$TOOLCHAIN"
          cmake -S egemodder-native -B egemodder-native/build \
            -DCMAKE_TOOLCHAIN_FILE="$TOOLCHAIN" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build egemodder-native/build --parallel 2
          test -s egemodder-native/build/libegemodder.so
      - name: Upload Android native library (NOT an APK)
        uses: actions/upload-artifact@v4
        with:
          name: Egemodder-Native-ARMv7-PATCH-NOT-APK
          path: egemodder-native/build/libegemodder.so
          if-no-files-found: error
