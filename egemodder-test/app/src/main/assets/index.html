<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Egemodder 1234 - Oynanabilir Mod Testi</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1222;color:white;font:15px system-ui;touch-action:manipulation}.wrap{max-width:760px;margin:auto;padding:10px}h1{font-size:21px;margin:8px 0}canvas{width:100%;height:auto;display:block;background:#91d6ff;border-radius:16px;touch-action:none}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}button{background:#315fe7;color:white;border:0;border-radius:12px;padding:12px 16px;font:inherit;touch-action:none}button:active{background:#183f9d}.menu{position:fixed;top:60px;right:10px;width:min(320px,calc(100vw - 20px));background:#152440;border:2px solid #5e84f8;border-radius:18px;padding:16px;z-index:10;box-shadow:0 12px 40px #0009}.menu label{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #364b70}.menu input[type=range]{width:130px}.menu input[type=password]{width:130px;padding:10px;border-radius:8px;background:#091428;color:white;border:1px solid #7188aa}.menu p{font-size:12px;color:#b8c6e4}.controls{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}.controls button{font-size:20px;min-width:60px;min-height:62px}.hint{color:#bac9e3;font-size:12px;margin:8px 0}#panel[hidden],#settings[hidden]{display:none}.status{font-size:12px;color:#b4ffca} .chip{background:#263b64;padding:6px 9px;border-radius:9px;font-size:12px}</style></head><body><div class="wrap"><div class="top"><div><h1>🐻 Egemodder 1234</h1><div class="status">Oynanabilir test · gerçek SBA APK'sı değildir</div></div><button id="toggle">☰ MOD MENÜ</button></div><canvas id="game" width="720" height="420" aria-label="Oynanabilir platform testi"></canvas><div class="controls"><div><button data-key="left">◀</button> <button data-key="right">▶</button></div><span class="chip" id="hud">Hız 1×</span><div><button data-key="down">▼</button> <button data-key="jump">A ⬆</button></div></div><p class="hint">Hareket: ◀ ▶ · Zıplama: A · Uçma açıksa A ile yüksel, ▼ ile alçal. Menü şifresi: 1234.</p><div class="menu" id="panel" hidden><div class="top"><strong>🎮 Egemodder Mod Menu</strong><button id="close">✕</button></div><div id="login"><p>Menüyü açmak için kodu gir.</p><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="1234"> <button id="unlock">Aç</button><p id="message" role="status"></p></div><div id="settings" hidden><label>🦘 Sınırsız zıplama <input type="checkbox" id="infinite"></label><label>🚀 Uçma modu <input type="checkbox" id="fly"></label><label>👻 No Clip <input type="checkbox" id="noclip"></label><label>⚡ Hız <span><output id="speedOut">1</output>×</span></label><input id="speed" type="range" min="1" max="10" value="1" style="width:100%"><p>No Clip açıkken bloklardan geçebilirsin. Bu özellikler yalnızca test oyununu etkiler.</p><button id="reset">Sıfırla</button> <button id="lock">Kilitle</button></div></div></div><script>
(()=>{'use strict';const $=x=>document.getElementById(x),c=$('game'),ctx=c.getContext('2d'),keys={left:false,right:false,jump:false,down:false},opts={infinite:false,fly:false,noclip:false,speed:1};let p={x:42,y:300,w:32,h:39,vx:0,vy:0,ground:false},jumpLatch=false;const blocks=[{x:0,y:388,w:720,h:32},{x:140,y:318,w:140,h:22},{x:360,y:257,w:150,h:22},{x:565,y:330,w:110,h:22},{x:290,y:360,w:34,h:28}];function reset(){Object.assign(opts,{infinite:false,fly:false,noclip:false,speed:1});['infinite','fly','noclip'].forEach(x=>$(x).checked=false);$('speed').value=1;$('speedOut').textContent='1';p={x:42,y:300,w:32,h:39,vx:0,vy:0,ground:false}}function toggle(){ $('panel').hidden=!$('panel').hidden} $('toggle').onclick=toggle;$('close').onclick=toggle;$('unlock').onclick=()=>{if($('pin').value==='1234'){$('login').hidden=true;$('settings').hidden=false;$('message').textContent=''}else $('message').textContent='Yanlış kod'};$('pin').onkeydown=e=>{if(e.key==='Enter')$('unlock').click()};$('lock').onclick=()=>{$('settings').hidden=true;$('login').hidden=false;$('pin').value='';$('panel').hidden=true};$('reset').onclick=reset;['infinite','fly','noclip'].forEach(x=>$(x).onchange=e=>opts[x]=e.target.checked);$('speed').oninput=e=>{opts.speed=+e.target.value;$('speedOut').textContent=opts.speed};document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const press=e=>{e.preventDefault();keys[k]=true;try{b.setPointerCapture(e.pointerId)}catch(_){}};const release=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',press);b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',()=>keys[k]=false)});window.addEventListener('keydown',e=>{const k=({ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'jump',' ':'jump',a:'left',d:'right',w:'jump',s:'down'})[e.key];if(k){keys[k]=true;e.preventDefault()}});window.addEventListener('keyup',e=>{const k=({ArrowLeft:'left',ArrowRight:'right',ArrowDown:'down',ArrowUp:'jump',' ':'jump',a:'left',d:'right',w:'jump',s:'down'})[e.key];if(k)keys[k]=false});function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function step(){const prev={...p};p.vx=((keys.right?1:0)-(keys.left?1:0))*2.5*opts.speed;if(opts.fly){p.vy=((keys.down?1:0)-(keys.jump?1:0))*3.5*opts.speed;p.ground=false}else{if(keys.jump&&!jumpLatch&&(p.ground||opts.infinite)){p.vy=-10.5;p.ground=false}p.vy=Math.min(p.vy+0.45,12)}jumpLatch=keys.jump;p.x+=p.vx;p.x=Math.max(0,Math.min(c.width-p.w,p.x));if(!opts.noclip)for(const b of blocks){if(collide(p,b)){if(p.vx>0)p.x=b.x-p.w;else if(p.vx<0)p.x=b.x+b.w}}p.y+=p.vy;p.ground=false;if(!opts.noclip)for(const b of blocks){if(collide(p,b)){if(p.vy>=0&&prev.y+prev.h<=b.y+12){p.y=b.y-p.h;p.vy=0;p.ground=true}else if(p.vy<0&&prev.y>=b.y+b.h-12){p.y=b.y+b.h;p.vy=0}}}if(p.y>c.height+80){p.x=42;p.y=300;p.vy=0}p.y=Math.max(0,p.y);$('hud').textContent=`Hız ${opts.speed}× · ${opts.fly?'UÇUŞ ':''}${opts.noclip?'NO CLIP ':''}${opts.infinite?'∞ ZIPLAMA':''}`}
function draw(){ctx.clearRect(0,0,720,420);ctx.fillStyle='#92d6ff';ctx.fillRect(0,0,720,420);ctx.fillStyle='#fef3b4';ctx.beginPath();ctx.arc(610,67,35,0,7);ctx.fill();ctx.fillStyle='#a6c8b3';for(let i=0;i<8;i++){ctx.beginPath();ctx.arc(i*125,385,90,Math.PI,2*Math.PI);ctx.fill()}for(const b of blocks){ctx.fillStyle='#80624c';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#60b756';ctx.fillRect(b.x,b.y,b.w,7)}ctx.save();if(opts.noclip)ctx.globalAlpha=.55;ctx.fillStyle='#a66b3e';ctx.fillRect(p.x,p.y+10,p.w,p.h-10);ctx.beginPath();ctx.arc(p.x+16,p.y+14,18,0,7);ctx.fill();ctx.beginPath();ctx.arc(p.x+4,p.y+2,8,0,7);ctx.arc(p.x+28,p.y+2,8,0,7);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(p.x+10,p.y+13,4,0,7);ctx.arc(p.x+23,p.y+13,4,0,7);ctx.fill();ctx.fillStyle='#171717';ctx.fillRect(p.x+10,p.y+12,3,3);ctx.fillRect(p.x+23,p.y+12,3,3);ctx.restore();ctx.fillStyle='#172a45';ctx.font='bold 17px system-ui';ctx.fillText('EGEMODDER TEST ALANI',15,28)}let last=0,acc=0;function frame(t){acc+=Math.min((t-last)||16,50);last=t;while(acc>=16.67){step();acc-=16.67}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
